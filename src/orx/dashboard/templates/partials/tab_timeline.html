<div class="tab-content">
    {% if timeline %}
    <section class="card">
        <div class="card-header"><h3>🧭 Event Timeline</h3></div>
        <div class="card-body">
            <table class="metrics-table">
                <thead>
                    <tr>
                        <th>Step</th>
                        <th>Type</th>
                        <th>Source</th>
                        <th>Event ID</th>
                    </tr>
                </thead>
                <tbody>
                    {% for event in timeline %}
                    <tr>
                        <td>{{ event.step_id }}</td>
                        <td>{{ event.event_type }}</td>
                        <td>{{ event.source }}</td>
                        <td><code>{{ event.event_id }}</code></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
    {% else %}
    <div class="empty-state">
        <p>No observability timeline yet.</p>
    </div>
    {% endif %}
</div>
