{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <a href="/" class="back-link">← Back to All Runs</a>
</div>

<!-- Run Header (polled while running) -->
{% include "partials/run_header.html" %}

<!-- Tabs -->
<div class="tabs">
    <button class="tab active" 
            data-tab="overview"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=overview"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        📊 Overview
    </button>
    <button class="tab"
            data-tab="artifacts"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=artifacts"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        📁 Artifacts
    </button>
    <button class="tab"
            data-tab="diff"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=diff"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        📝 Diff
    </button>
    <button class="tab"
            data-tab="logs"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=logs"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        📜 Logs
    </button>
    <button class="tab"
            data-tab="metrics"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=metrics"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        📈 Metrics
    </button>
    <button class="tab"
            data-tab="timeline"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=timeline"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        🧭 Timeline
    </button>
    <button class="tab"
            data-tab="llm"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=llm"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        🧠 LLM
    </button>
    <button class="tab"
            data-tab="proc"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=proc"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        ⚙️ Proc
    </button>
    <button class="tab"
            data-tab="fs"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=fs"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        🗂️ FS
    </button>
    <button class="tab"
            data-tab="tty"
            hx-get="/partials/run-tab/{{ run.run_id }}?tab=tty"
            hx-target="#tab-content"
            hx-swap="innerHTML"
            onclick="setActiveTab(this)">
        🖥️ TTY
    </button>
</div>

<!-- Tab Content -->
<div id="tab-content"
     hx-get="/partials/run-tab/{{ run.run_id }}?tab=overview"
     hx-trigger="load"
     hx-swap="innerHTML">
    <div class="loading">Loading tab content...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
function setActiveTab(btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
}
</script>
{% endblock %}
